# ============================================================================
# attacks.ini  --  CARAZONE / ZonalRingTopology attack scenarios
# ----------------------------------------------------------------------------
# Includes the generated omnetpp.ini (topology + gPTP + benign traffic + stats
# + scenarioManager) and layers attack [Config ...] sections on top. The only
# difference between a clean run and an attacked run is the injected fault, so
# [General] (the baseline) is your reference and each config below is a delta.
#
# Run a config with:   -c <ConfigName>   (e.g. -c Gptp_Drift_Deep)
# Baseline run:        -c Baseline        (== [General], no fault)
# Verified target:     OMNeT++ 6.4.0 + INET 4.7.0
# ============================================================================

include omnetpp.ini

# Explicit alias for the clean run so run_experiments.py can name it.
[Config Baseline]
description = "Benign baseline (topology + gPTP + traffic), no attack"


# ============================================================================
# 1. gPTP ATTACKS  (config-only, no C++ -- reuses your drift-attack idea)
#    A compromised node's local clock is forced to diverge from the grandmaster.
#    One victim per config, at different sync-tree depths, so you can show the
#    depth-dependent severity your topology report predicts (feature skew).
# ============================================================================

# Victim close to the grandmaster (shallow)
# NOTE: 2000ppm is well beyond the +/-100ppm benign range so the rate-ratio and
# underlying-clock signals are unmistakable. The SERVO still tracks constant drift,
# so the synchronized clock stays close -- that is expected; detect on the gPTP
# correction signals (gmRateRatio / neighborRateRatio / pdelay), not the final time.
[Config Gptp_Drift_Shallow]
description = "gPTP drift attack on a shallow node (gnssReceiver)"
*.gnssReceiver.clock.oscillator.typename = "ConstantDriftOscillator"
*.gnssReceiver.clock.oscillator.driftRate = 2000ppm

# Victim deep in the tree (leaf under swRR, furthest from grandmaster)
[Config Gptp_Drift_Deep]
description = "gPTP drift attack on a deep leaf (lidarRR) -- compounded sync error"
*.lidarRR.clock.oscillator.typename = "ConstantDriftOscillator"
*.lidarRR.clock.oscillator.driftRate = 2000ppm

# Severity sweep -> 4 labelled runs. Spans from servo-tracked (500ppm) up to where
# the correction loop struggles (10000ppm). The threshold is itself a result.
[Config Gptp_Drift_Sweep]
description = "gPTP drift severity sweep on lidarRR"
*.lidarRR.clock.oscillator.typename = "ConstantDriftOscillator"
*.lidarRR.clock.oscillator.driftRate = ${drift=500,2000,5000,10000}ppm

# Event-timed: clean window THEN attack window in one run (needs scenarioManager,
# now present in the network). Great for labelled pre/post segments, no C++.
[Config Gptp_Drift_Timed]
description = "Clean until 1s, then lidarRR drift kicks in"
*.scenarioManager.script = xml("<script>\
    <at t='1s'>\
      <set-param module='lidarRR.clock.oscillator' par='driftRate' value='500ppm'/>\
    </at>\
  </script>")


# ============================================================================
# 2. FRER (802.1CB) ATTACKS
#    FRER is enabled here (the base INI has no stream redundancy). The protected
#    stream brakeECU->centralCompute runs over two paths that are disjoint in
#    the middle: A = FL->C direct, B = FL->FR->C around the ring. They split at
#    swFL (replication) and merge at swC (elimination), which has a separate
#    port to swFL and to swFR -- so swC sees both copies. centralCompute then
#    gets a single frame over its one uplink; no shared-MAC trick is needed.
# ============================================================================

[Config Frer_Enabled]
description = "FRER enabled + benign: brakeECU->centralCompute over two disjoint ring paths"
*.*.hasStreamRedundancy = true
# FRER uses its own VLAN/stream-ID forwarding, so disable shortest-path MAC learning
*.macForwardingTableConfigurator.typename = ""
*.streamRedundancyConfigurator.typename = "StreamRedundancyConfigurator"
*.streamRedundancyConfigurator.configuration = [{name: "brakeStream", packetFilter: "*", \
        source: "brakeECU", destination: "centralCompute", \
        trees: [[["brakeECU", "swFL", "swC", "centralCompute"]], \
                [["brakeECU", "swFL", "swFR", "swC", "centralCompute"]]]}]

# --- 2a. Path-failure / link-cut attack (scenarioManager) ---
# Kills FRER path B mid-run. A healthy FRER stream must survive on path A;
# whether/how delivery degrades is the detection signal.
[Config Frer_PathCut]
extends = Frer_Enabled
description = "Crash swFR at 1s (cuts FRER path B); path A must carry the stream"
*.scenarioManager.script = xml("<script>\
    <at t='1s'><crash module='swFR'/></at>\
    <at t='1.5s'><startup module='swFR'/></at>\
  </script>")

# --- 2b. Duplicate-injection flood (config-only) ---
# A rogue node mimics the protected stream's traffic to stress elimination at swC.
[Config Frer_DuplicateFlood]
extends = Frer_Enabled
description = "Rogue node (radarFL) floods duplicate-like traffic toward the FRER sink"
*.radarFL.numApps = 1
*.radarFL.app[0].typename = "UdpSourceApp"
*.radarFL.app[0].io.destAddress = "centralCompute"
*.radarFL.app[0].io.destPort = 1000
*.radarFL.app[0].source.packetLength = 100B
*.radarFL.app[0].source.productionInterval = 200us   # 5x the real stream rate

# --- 2c. Combined gPTP + FRER (compound scenario for the report) ---
[Config Frer_Plus_GptpDrift]
extends = Frer_Enabled
description = "gPTP drift on swFR (a node on FRER path B) while FRER is active"
*.swFR.clock.oscillator.typename = "ConstantDriftOscillator"
*.swFR.clock.oscillator.driftRate = 2000ppm