# Generated by gen_topology.py - edit the script, not this file.
[General]
network = ZonalRingTopology
sim-time-limit = 2s
simtime-resolution = fs
description = "5-zone TSN zonal ring: topology + gPTP + benign traffic (attacks in attacks.ini)"

**.transmitter.typename = "StreamingTransmitter"
**.receiver.typename = "DestreamingReceiver"

# gPTP / local clocks in every node (same pattern as the INET gPTP showcase)
*.*.hasTimeSynchronization = true
**.masterClock.clock.oscillator.typename = "RandomDriftOscillator"
**.oscillator.nominalTickLength = 10ns
**.oscillator.changeInterval = 12.5ms
**.oscillator.driftRate = uniform(-100ppm, 100ppm)
**.oscillator.driftRateChange = uniform(-1ppm, 1ppm)
**.oscillator.driftRateChangeUpperLimit = 100ppm
**.oscillator.driftRateChangeLowerLimit = -100ppm
**.referenceClock = "masterClock.clock"

# ---- result recording (needed for both baseline and attack analysis) ----
**.scalar-recording = true
**.vector-recording = true
# Clock signals: the SYNCHRONIZED clock and the uncorrected UNDERLYING oscillator.
# A constant-drift attack is largely absorbed by the gPTP servo, so the corrected
# clock barely moves -- the attack fingerprint lives in the underlying clock and,
# above all, in the correction-effort signals below.
**.clock.timeChanged:vector.vector-recording = true
**.clock.underlyingClock.timeChanged:vector.vector-recording = true
# gPTP correction-effort signals -- the real detection features for drift attacks:
# the rate ratios the servo applies and the measured peer (link) delay.
# The wildcard turns on every gptp vector statistic (robust across INET versions);
# the named lines document the three that matter. Harmless if a name differs --
# verify with:  opp_scavetool export -f 'module =~ "*gptp*"' -o /dev/stdout results/<run>.vec
**.gptp.*:vector.vector-recording = true
**.gptp.gmRateRatio:vector.vector-recording = true
**.gptp.neighborRateRatio:vector.vector-recording = true
**.gptp.pdelay:vector.vector-recording = true
# FRER / delivery metrics: what sinks receive
**.app[*].packetReceived:count.scalar-recording = true

# visualisation (optional, GUI only)
*.visualizer.typename = "IntegratedMultiCanvasVisualizer"
*.visualizer.dataLinkVisualizer[0].displayLinks = true
*.visualizer.dataLinkVisualizer[0].activityLevel = "protocol"
*.visualizer.dataLinkVisualizer[0].packetFilter = "GptpSync"
*.visualizer.dataLinkVisualizer[0].lineColor = "blue2"

