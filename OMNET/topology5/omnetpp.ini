# ---- static gPTP tree rooted at masterClock -> swC -> {swFL, swFR} -> {swRL, swRR} -> devices
# (ring links FL-FR and RL-RR stay unused for sync; INET gPTP has no BMCA, ports are static)
*.masterClock.gptp.masterPorts = ["eth0"]
*.swC.gptp.slavePort = "eth10"
*.swC.gptp.masterPorts = ["eth5", "eth4", "eth7", "eth8", "eth6", "eth2", "eth3", "eth0", "eth1", "eth9"]
*.swFL.gptp.slavePort = "eth2"
*.swFL.gptp.masterPorts = ["eth8", "eth5", "eth6", "eth3", "eth4", "eth7", "eth1", "eth9", "eth10"]
*.swFR.gptp.slavePort = "eth2"
*.swFR.gptp.masterPorts = ["eth5", "eth8", "eth3", "eth6", "eth4", "eth1", "eth7", "eth9"]
*.swRL.gptp.slavePort = "eth1"
*.swRL.gptp.masterPorts = ["eth2", "eth3", "eth4", "eth5"]
*.swRR.gptp.slavePort = "eth0"
