#
# CARAZONE PoC — OMNeT++ 6.4.0 / INET 4.7.0
#
# Four run configurations:
#   Benign          — no attack, baseline traffic + gPTP
#   DelayAttack     — asymmetric link delay injected on a zone uplink (gPTP delay attack)
#   DriftAttack     — oscillator drift manipulation at a zone controller clock
#   SyncStarvation  — zone uplink taken down, zone loses gPTP sync
#

[General]
network = carazone.simulations.CarazoneZonalNetwork
sim-time-limit = 10s
description = "CARAZONE zonal TSN network with gPTP"

# gPTP peer-delay measurement needs sub-picosecond resolution. The OMNeT++
# default of 1ps is too coarse and silently quantises the delay estimates.
simtime-resolution = fs

# ---------------------------------------------------------------------------
# Link layer
# ---------------------------------------------------------------------------
#**.eth[*].bitrate = 100Mbps

**.transmitter.typename = "StreamingTransmitter"
**.receiver.typename = "DestreamingReceiver"

# ---------------------------------------------------------------------------
# Clocks and oscillators
# ---------------------------------------------------------------------------
*.*.hasTimeSynchronization = true

**.oscillator.nominalTickLength = 10ns
**.oscillator.changeInterval = 12.5ms
**.oscillator.driftRate = uniform(-100ppm, 100ppm)
**.oscillator.driftRateChange = uniform(-1ppm, 1ppm)
**.oscillator.driftRateChangeUpperLimit = 100ppm
**.oscillator.driftRateChangeLowerLimit = -100ppm
*.gm.clock.oscillator.typename = "RandomDriftOscillator"

# Every clock measures its offset against the grandmaster.
**.referenceClock = "gm.clock"

# ---------------------------------------------------------------------------
# gPTP spanning tree (INET has no BMCA — the tree is declared manually)
#   gm --> backbone --> {cvc, zone[0..3]} --> ECUs
# ---------------------------------------------------------------------------
*.gm.gptp.masterPorts = ["eth0"]

*.backbone.gptp.slavePort = "eth0"
*.backbone.gptp.masterPorts = ["eth1", "eth2", "eth3", "eth4", "eth5"]

*.zone[*].gptp.slavePort = "eth0"
*.zone[*].gptp.masterPorts = ["eth1", "eth2"]

*.cvc.gptp.slavePort = "eth0"
*.ecu[*].gptp.slavePort = "eth0"

**.gptp.syncInterval = 125ms
**.gptp.pdelayInterval = 31.25ms

# ---------------------------------------------------------------------------
# Application traffic
# ---------------------------------------------------------------------------
*.cvc.numApps = 1
*.cvc.app[0].typename = "UdpSinkApp"
*.cvc.app[0].io.localPort = 1000

*.ecu[*].numApps = 1
*.ecu[*].app[0].typename = "UdpSourceApp"
*.ecu[*].app[0].io.destAddress = "cvc"
*.ecu[*].app[0].io.destPort = 1000

*.ecu[0..1].app[0].source.packetLength = 1000B
*.ecu[0..1].app[0].source.productionInterval = exponential(400us)
*.ecu[2..3].app[0].source.packetLength = 500B
*.ecu[2..3].app[0].source.productionInterval = exponential(1ms)
*.ecu[4..5].app[0].source.packetLength = 100B
*.ecu[4..5].app[0].source.productionInterval = exponential(2ms)
*.ecu[6..7].app[0].source.packetLength = 800B
*.ecu[6..7].app[0].source.productionInterval = exponential(2ms)

# ---------------------------------------------------------------------------
# Result recording
# ---------------------------------------------------------------------------
**.scalar-recording = true

output-vector-file = "${resultdir}/${configname}-${iterationvarsf}${repetition}.vec"
output-scalar-file = "${resultdir}/${configname}-${iterationvarsf}${repetition}.sca"


# ===========================================================================
# 0 — Benign baseline
# ===========================================================================
[Config Benign]
description = "No attack: normal traffic and gPTP synchronisation"
repeat = 3


# ===========================================================================
# 1 — gPTP delay attack
# ===========================================================================
[Config DelayAttack]
description = "Asymmetric link delay injected on a zone uplink"
repeat = 3

*.targetZone = ${targetZone = 0, 1, 2, 3}
**.gwPort = ${gwPort = 2, 3, 4, 5 ! targetZone}

*.scenarioManager.script = xml("<scenario>\
    <at t='4'>\
      <set-channel-param src-module='backbone' src-gate='ethg$o[${gwPort}]' par='delay' value='2us'/>\
    </at>\
    <at t='7'>\
      <set-channel-param src-module='backbone' src-gate='ethg$o[${gwPort}]' par='delay' value='6us'/>\
    </at>\
  </scenario>")


# ===========================================================================
# 2 — Clock / oscillator manipulation
# ===========================================================================
[Config DriftAttack]
description = "Oscillator drift manipulation at a zone controller"
repeat = 3
 
# INET 4.7's driftRate is not declared @mutable, so ScenarioManager cannot
# change it at runtime ("Setting the parameter is not allowed at runtime").
# INET's own clockdrift showcase only ever sets fixed rates, so there is no
# supported runtime path. The victim therefore runs with a manipulated
# oscillator for the WHOLE run rather than from t=4s.
#
# Consequence for labelling: every window of a victim zone in this config is
# an attack window. extract_features.py handles this via ALWAYS_ON_CONFIGS.
*.targetZone = ${targetZone = 0, 1, 2, 3}
*.zone[0].clock.oscillator.driftRate = 800ppm
 


# ===========================================================================
# 3 — Sync starvation
# ===========================================================================
[Config SyncStarvation]
description = "Victim zone uplink taken down, gPTP sync lost"
repeat = 3

*.targetZone = ${targetZone = 0, 1, 2, 3}

*.scenarioManager.script = xml("<scenario>\
    <at t='4'>\
      <set-channel-param src-module='zone[${targetZone}]' src-gate='ethg$o[0]' par='datarate' value='1kbps'/>\
    </at>\
  </scenario>")